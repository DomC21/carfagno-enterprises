<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300">
  <defs>
    <linearGradient id="zomGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" /> <!-- teal-400 -->
      <stop offset="100%" stop-color="#3B82F6" /> <!-- blue-500 -->
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="500" height="300" fill="#0F172A" /> <!-- slate-900 background -->
  
  <!-- Zom AI Logo -->
  <g transform="translate(100, 80)">
    <!-- Z -->
    <path d="M20 30 L80 30 L20 120 L80 120" 
          fill="none" 
          stroke="url(#zomGradient)" 
          stroke-width="15"
          stroke-linecap="round"/>
    
    <!-- O -->
    <circle cx="120" cy="75" r="45" 
            fill="none" 
            stroke="url(#zomGradient)" 
            stroke-width="15"/>
    
    <!-- M -->
    <path d="M180 120 L180 30 L210 75 L240 30 L240 120" 
          fill="none" 
          stroke="url(#zomGradient)" 
          stroke-width="15"
          stroke-linecap="round"/>
    
    <!-- AI with circuit pattern -->
    <g transform="translate(260, 30)">
      <text x="0" y="50" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="url(#zomGradient)" filter="url(#glow)">AI</text>
      
      <!-- Digital circuit pattern -->
      <path d="M0 70 L20 70 L20 90 M40 60 L60 60 L60 80 M30 100 L50 100 L50 80" 
            fill="none" 
            stroke="#94A3B8" 
            stroke-width="3"
            stroke-linecap="round"
            opacity="0.5"/>
    </g>
  </g>
  
  <!-- Tagline -->
  <text x="250" y="220" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle">Your AI Companion in the Market</text>
</svg>
